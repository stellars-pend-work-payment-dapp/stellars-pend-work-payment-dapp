<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Stellar Payment Gateway">
  <defs>
    <linearGradient id="spg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12328a"/>
      <stop offset="55%" stop-color="#0a2568"/>
      <stop offset="100%" stop-color="#081f5c"/>
    </linearGradient>
    <linearGradient id="spg-star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#68f9f2"/>
      <stop offset="100%" stop-color="#39bfb7"/>
    </linearGradient>
    <radialGradient id="spg-glow" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0%" stop-color="#7096d1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7096d1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge background -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="23" fill="url(#spg-bg)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="23" fill="url(#spg-glow)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="23" fill="none" stroke="#334eac" stroke-width="2"/>

  <!-- Stellar 4-point star -->
  <g transform="translate(50 46) rotate(45)">
    <rect x="-7.5" y="-31" width="15" height="62" rx="7.5" fill="url(#spg-star)"/>
    <rect x="-31" y="-7.5" width="62" height="15" rx="7.5" fill="#68f9f2"/>
  </g>
  <circle cx="50" cy="46" r="4.5" fill="#081f5c" opacity="0.9"/>

  <!-- Payment / send arrow motif -->
  <g stroke="#7096d1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M50 62 L50 80"/>
    <path d="M43.5 74 L50 80.5 L56.5 74"/>
  </g>
  <circle cx="50" cy="58" r="2.6" fill="#bad6eb"/>
</svg>
