[workspace]
resolver = "2"
members = ["work-escrow"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/stellars-pend-work-payment-dapp/stellars-pend-work-payment-dapp"

# NOTE: do not downgrade below 25 without also pinning `ed25519-dalek`.
# `soroban-env-host` < 25.2.2 declares `ed25519-dalek = ">=2.0.0"` with no upper
# bound, so cargo resolves the API-incompatible 3.x line and `cargo test` fails
# in the `testutils` build with
#   the trait bound `ChaCha20Rng: CryptoRng` is not satisfied
# 29.0.0 pins `soroban-env-host = "=29.0.0"`, which declares `^2.0.0`.
[workspace.dependencies]
soroban-sdk = "29.0.0"

# Soroban contracts are compiled to a `no_std`-style wasm target. Building the
# host (native) target is still supported and is what `cargo test` uses, so the
# contract logic is unit-testable without a wasm toolchain.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
